name: CLA

# Every external contributor signs CLA.md once, by commenting on their pull
# request. Signatures are committed to the `cla-signatures` branch of this
# repository, so no third-party service or extra token is involved.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/objectstack-ai/bridges/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot],objectstack-fleet[bot],claude[bot]
